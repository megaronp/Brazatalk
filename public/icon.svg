<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="#090a0f" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" fill-opacity="0.15" stroke="url(#bgGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Chat Bubble + Flame Icon -->
  <g transform="translate(256, 240)">
    <!-- Chat bubble back -->
    <path d="M-130,-110 C-130,-165 130,-165 130,-110 C130,20 20,40 -20,70 L-60,110 L-60,70 C-110,65 -130,30 -130,-110 Z" fill="#141724" stroke="#6366f1" stroke-width="8" filter="url(#glow)"/>
    
    <!-- Flame / Audio Wave glyph -->
    <path d="M0,45 C-45,20 -60,-30 -35,-75 C-30,-85 -18,-95 -10,-105 C-5,-75 15,-65 25,-40 C35,-15 30,20 0,45 Z" fill="url(#flameGrad)" />
    <path d="M-5,35 C-25,20 -35,-10 -20,-40 C-15,-20 0,-15 5,5 C10,-10 15,0 12,20 C5,30 0,35 -5,35 Z" fill="#fef08a" />

    <!-- Sound waves -->
    <circle cx="-65" cy="-25" r="8" fill="#818cf8" />
    <circle cx="65" cy="-25" r="8" fill="#818cf8" />
    <path d="M-85,-45 C-105,-25 -105,5 -85,25" stroke="#818cf8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M85,-45 C105,-25 105,5 85,25" stroke="#818cf8" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography Label -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">BRAZA TALK</text>
</svg>
